# ----------------------------------------------------------------------------------------------------
# WALTER - Solar Router for a hot-water boiler
# (ESP32 + RobotDyn AC dimmer 40A with current sensor + Shelly EM3 Pro)
# ----------------------------------------------------------------------------------------------------
# WALTER drives the boiler from the *3-phase arithmetic sum* measured as close as
# possible to the main meter, exactly like it is billed:  S_grid = P_A + P_B + P_C
#    + S_grid  -> importing (boiler stays off)
#    - S_grid  -> surplus after cross-phase netting (boiler is dimmed up to absorb it)
#
# Hardware:
#   Board   : ESP32 (esp32dev) + RobotDyn AC dimmer 40A "with current sensor"
#             (heatsink NTC + 5V fan + built-in CT). FAN pin hardwired to 5V (fan always on).
#   Meter   : Shelly EM3 Pro / Pro 3EM, polled locally over HTTP (no HA dependency)
#   Load    : 2400 W immersion element (water boiler)
#   Safety  : local dimmer safety package (heatsink thermal cutout + current-sensor health),
#             boiler thermostat remains in the circuit
#
# ----------------------------------------------------------------------------------------------------
# ESPHome configuration - This part depends on your hardware target
# ----------------------------------------------------------------------------------------------------
esphome:
  name: walter
  friendly_name: WALTER
  min_version: 2026.1.0

esp32:
  board: esp32dev
  framework:
    type: esp-idf

# Enable logging
logger:
  baud_rate: 115200
  level: INFO
  logs:
    component: ERROR
    light: ERROR

# Enable Home Assistant API
api:
  encryption:
    key: !secret api_encryption_key

# Enable over-the-air updates
ota:
  - platform: esphome
    password: !secret walter_ota_password

# Enable improv serial
improv_serial:

# WiFi connection
wifi:
  ssid: !secret wifi_ssid
  password: !secret wifi_password
  reboot_timeout: 24h

# Activate web interface
web_server:
  port: 80

# Watchdog needs to be greater than the http_request timeouts
http_request:
  timeout: 12s

# ----------------------------------------------------------------------------------------------------
# Customisation
# ----------------------------------------------------------------------------------------------------
packages:
  solar_router:
    # WALTER fork: contains the upstream packages PLUS the fork-specific ones
    # (power_meter_shelly_em3.yaml, dimmer_safety.yaml) that only exist here.
    url: https://github.com/merryspankersltd/WALTER/
    ref: main
    refresh: 1d
    files:
      - path: solar_router/common.yaml

      # ---------------- Power meter: Shelly EM3 Pro / Pro 3EM ----------------
      # Resolves the 3-phase arithmetic sum (`total_act_power`) directly, no HA needed.
      - path: solar_router/power_meter_shelly_em3.yaml
        vars:
          power_meter_ip_address: "192.168.1.110"
          # power_meter_emeter_id: "0"      # only if the EM component id differs
          # show_phase_power: "False"       # set to "True" while tuning

      # ---------------- Regulator: dimmer 40A (with current sensor) ---------------
      # Z-C = zero-cross detector, GATE = triac gate. Pick interrupt-capable pins.
      - path: solar_router/regulator_triac.yaml
        vars:
          regulator_gate_pin: GPIO17
          regulator_zero_crossing_pin: GPIO23

      # ---------------- Engine: 1 dimmer, progressive regulation ----------------
      - path: solar_router/engine_1dimmer.yaml
        vars:
          green_led_pin: GPIO18
          yellow_led_pin: GPIO19

      # ---------------- Safety: dimmer board safety (local, no HA needed) ----------------
      # Local heatsink thermal cutout (works even if WiFi/HA are down) + CT current-sensor
      # health alarms. TEMP = GPIO34, CUR = GPIO35 (ADC1, input-only pins).
      # The engine immediately drops to 0 % when the heatsink reaches "80 °C" (default),
      # and restarts under "60 °C". Boiler thermostat remains the final protection.
      # NOTE: only ONE safety limiter package per configuration (they share safety_limit).
      - path: solar_router/dimmer_safety.yaml
        vars:
          dimmer_temp_pin: GPIO34
          dimmer_current_pin: GPIO35
          red_led_pin: GPIO21
          # heatsink_stop_temperature: "80"
          # heatsink_restart_temperature: "60"
          # overcurrent_current: "12.0"
          # overcurrent_restart_current: "8.0"
          # current_calibration_factor: "1.0"    # tune on the bench (see docs/en/bench_test.md)

      # ---------------- Optional: energy diverted counter ---------------------------
      # Set the "Load power" number (W) in HA to 2400. It counts  level% * load power.
      # - path: solar_router/energy_counter_theorical.yaml

      # ---------------- Optional: forced-run during off-peak (HC) ----------------
      # Force the boiler at 100% between Begin and End even with no sun.
      # Only useful if the boiler HAS NO classical night-contact upstream of the dimmer.
      # - path: solar_router/scheduler_forced_run.yaml
      #   vars:
      #     scheduler_unique_id: "Night"