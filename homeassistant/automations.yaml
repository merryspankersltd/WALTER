# ----------------------------------------------------------------------------------------------------
# Home Assistant — automations related to WALTER
# ----------------------------------------------------------------------------------------------------
# Reference examples. Adjust services/entities to your names
# (WALTER exposes: switch.activate_solar_routing, number.router_level,
#  number.target_grid_exchange, switch.activate_night_scheduler...).

# ---------- 1. Mode selector: OFF / SOLAR / HC (HC = off-peak forced-run) ----------
# Create an input_select "walter_mode" with options: OFF | SOLAR | HC
automation:
  - id: walter_mode_control
    alias: "WALTER: mode control"
    trigger:
      - platform: state
        entity_id: input_select.walter_mode
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_select.walter_mode
                state: "OFF"
            sequence:
              - service: switch.turn_off
                target: { entity_id: "switch.activate_solar_routing" }
          - conditions:
              - condition: state
                entity_id: input_select.walter_mode
                state: "SOLAR"
            sequence:
              - service: switch.turn_on
                target: { entity_id: "switch.activate_solar_routing" }
              # with a revente contract you may instead allow a small export:
              # - service: number.set_value
              #   entity_id: number.target_grid_exchange
              #   value: -200
          - conditions:
              - condition: state
                entity_id: input_select.walter_mode
                state: "HC"
            sequence:
              # Off-peak: force full power (replaces the classic night contact)
              - service: switch.turn_off
                target: { entity_id: "switch.activate_solar_routing" }
              - service: number.set_value
                target: { entity_id: "number.router_level" }
                data: { value: 100 }

# ---------- 2. Auto route ONLY in HP (peak) hours when surplus exists ----------
# Keep routing OFF during unstoppable off-peak so the boiler only stops when warm.
  - id: walter_off_peak_override
    alias: "WALTER: stick to solar during off-peak"
    trigger:
      - platform: state
        entity_id: input_boolean.off_peak_tariff_active
    action:
      - choose:
          - conditions:
              - condition: state
                entity_id: input_boolean.off_peak_tariff_active
                state: "on"
            sequence:
              - service: switch.turn_off
                target: { entity_id: "switch.activate_solar_routing" }
          - conditions:
              - condition: state
                entity_id: input_boolean.off_peak_tariff_active
                state: "off"
            sequence:
              - service: switch.turn_on
                target: { entity_id: "switch.activate_solar_routing" }

# ---------- 3. Protection: disable if tank too hot (double safety) ----------
  - id: walter_tank_hot_shutdown
    alias: "WALTER: emergency stop when tank is hot"
    trigger:
      - platform: numeric_state
        entity_id: sensor.water_tank_temperature
        above: 68
    action:
      - service: switch.turn_off
        target: { entity_id: "switch.activate_solar_routing" }
    mode: restart

# ---------- 4. (optional) recovery-log telemetry -----------------------------
# Log real_power + router_level every minute so regression is traceable
# lives in HA recorder; a history_stats card is enough.

# ---------- 5. HC forced window IF the boiler has NO night contact ----------
# (only relevant when option 2 in docs/en/strategy.md applies)
#  - id: walter_hc_forced_window
#    alias: "WALTER: forced 100% during off-peak"
#    trigger:
#      - platform: solar
#        ...
# Use instead the scheduler_forced_run package in the ESP (Begin/End hours),
# the router itself then manages the window with less complexity.
# ---------- 6. Notifications ------------------------------------------------
# All notifications are delivered from Home Assistant (mobile push via the
# companion app, persistent notifications in the UI). The ESP32 remains the
# alarm *source*: local safety cutouts keep working even if WiFi/HA are down.
# The ESP32 exposes these problem sensors:
#   binary_sensor.<device>_dimmer_safety_active
#   binary_sensor.<device>_triac_stuck_on
#   binary_sensor.<device>_boiler_not_powered
#   binary_sensor.<device>_current_sensor_failure
#
# Resolved notifications dismiss the original via notification_id.

# --- 6a. Safety cutout (heatsink overheat or overcurrent) -> mobile push ---
  - id: walter_safety_cutout_notify
    alias: "WALTER: safety cutout alert"
    trigger:
      - platform: state
        entity_id: binary_sensor.salon_walter_dimmer_safety_active
        to: "on"
        for: "00:00:30"
    action:
      - service: persistent_notification.create
        data:
          notification_id: walter_safety_cutout
          title: "WALTER: safety cutout active"
          message: >-
            The dimmer safety has cut power (heatsink overheat or overcurrent).
            Heatsink: {{ states('sensor.salon_walter_dimmer_heatsink_temperature') }} °C,
            load current: {{ states('sensor.salon_walter_dimmer_load_current') }} A.
            Check the heatsink fan, NTC contact and the load.
      - service: notify.mobile_app_pixel_5
        data:
          title: "WALTER: safety cutout"
          message: >-
            Dimmer power cut — heatsink
            {{ states('sensor.salon_walter_dimmer_heatsink_temperature') }} °C,
            load {{ states('sensor.salon_walter_dimmer_load_current') }} A.
          data:
            clickAction: "/lovelace/dashboard-walter"
            url: "/lovelace/dashboard-walter"
    mode: single

  - id: walter_safety_cutout_clear
    alias: "WALTER: safety cutout resolved"
    trigger:
      - platform: state
        entity_id: binary_sensor.salon_walter_dimmer_safety_active
        to: "off"
        for: "00:00:30"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: walter_safety_cutout
      - service: notify.mobile_app_pixel_5
        data:
          title: "WALTER: safety cutout resolved"
          message: "Dimmer safety has been restored."
    mode: single

# --- 6b. Hardware alarms (triac stuck / boiler not powered / CT fail) ------
  - id: walter_hardware_alarm_notify
    alias: "WALTER: hardware alarm alert"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.salon_walter_triac_stuck_on
          - binary_sensor.salon_walter_boiler_not_powered
          - binary_sensor.salon_walter_current_sensor_failure
        to: "on"
        for: "00:00:30"
    action:
      - service: persistent_notification.create
        data:
          notification_id: "walter_hardware_{{ trigger.to_state.entity_id.split('.')[1].split('_walter_')[1] }}"
          title: "WALTER: hardware alarm"
          message: >-
            {{ trigger.to_state.name }} is ON.
            Load current: {{ states('sensor.salon_walter_dimmer_load_current') }} A.
      - service: notify.mobile_app_pixel_5
        data:
          title: "WALTER: hardware alarm"
          message: "{{ trigger.to_state.name }} is ON."
          data:
            clickAction: "/lovelace/dashboard-walter"
            url: "/lovelace/dashboard-walter"
    mode: single

  - id: walter_hardware_alarm_clear
    alias: "WALTER: hardware alarm resolved"
    trigger:
      - platform: state
        entity_id:
          - binary_sensor.salon_walter_triac_stuck_on
          - binary_sensor.salon_walter_boiler_not_powered
          - binary_sensor.salon_walter_current_sensor_failure
        to: "off"
        for: "00:00:30"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: "walter_hardware_{{ trigger.to_state.entity_id.split('.')[1].split('_walter_')[1] }}"
    mode: single

# --- 6c. WALTER node offline (no mobile push, persistent only) --------------
  - id: walter_node_offline_notify
    alias: "WALTER: node offline alert"
    trigger:
      - platform: template
        value_template: "{{ not has_value('sensor.salon_walter_real_power') }}"
        for: "00:05:00"
    action:
      - service: persistent_notification.create
        data:
          notification_id: walter_node_offline
          title: "WALTER: node offline"
          message: >-
            The WALTER ESP32 has been unreachable for 5 minutes.
            Local safety cutouts keep working, but solar routing is off.
    mode: single

  - id: walter_node_offline_clear
    alias: "WALTER: node offline resolved"
    trigger:
      - platform: template
        value_template: "{{ has_value('sensor.salon_walter_real_power') }}"
        for: "00:02:00"
    action:
      - service: persistent_notification.dismiss
        data:
          notification_id: walter_node_offline
    mode: single
